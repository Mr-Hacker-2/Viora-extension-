<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viora API Model Selector</title>
    <style>
      :root {
        --bg: #0f1117;
        --panel: #171b23;
        --panel-2: #1e2430;
        --panel-3: #232d3d;
        --border: rgba(255,255,255,0.08);
        --text: #edf3ff;
        --muted: #9aa9c2;
        --accent: #8b5cf6;
        --accent-2: #3b82f6;
        --success: #25c281;
        --warning: #ffd166;
        --shadow: 0 18px 32px rgba(0,0,0,0.32);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(123,92,255,0.2), transparent 38%),
          linear-gradient(180deg, #0b0f15, #121821 38%, #0b0f15);
        color: var(--text);
        font-family: Inter, "Segoe UI", sans-serif;
      }

      .card {
        width: min(760px, 92vw);
        background: rgba(20, 25, 34, 0.9);
        border: 1px solid var(--border);
        border-radius: 26px;
        box-shadow: var(--shadow);
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 18px 20px 14px;
        background: rgba(255,255,255,0.02);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand-mark {
        width: 30px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
      }

      .status-pill {
        padding: 8px 12px;
        border: 1px solid rgba(37,194,129,0.38);
        border-radius: 999px;
        background: rgba(37,194,129,0.08);
        color: #bdf7d0;
        font-size: 12px;
        font-weight: 600;
      }

      .content {
        padding: 20px;
      }

      .section {
        margin-bottom: 18px;
      }

      .label {
        display: block;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .select-wrap {
        position: relative;
      }

      select {
        width: 100%;
        appearance: none;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
        color: var(--text);
        border-radius: 16px;
        padding: 17px 46px 17px 16px;
        font-size: 15px;
        font-weight: 600;
        outline: none;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      select:focus {
        border-color: rgba(139, 92, 246, 0.9);
        box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
      }

      .caret {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 18px;
        pointer-events: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 18px;
      }

      .key-box {
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255,255,255,0.02);
        padding: 14px 14px 12px;
      }

      .key-box strong {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        color: var(--text);
      }

      .key-box .token {
        display: inline-block;
        width: 100%;
        padding: 9px 10px;
        border-radius: 10px;
        background: rgba(255,255,255,0.03);
        color: var(--muted);
        font-size: 12px;
        font-family: "SFMono-Regular", Consolas, monospace;
        border: 1px solid rgba(255,255,255,0.04);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .summary {
        margin-top: 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid rgba(139, 92, 246, 0.2);
        border-radius: 16px;
        background: rgba(139, 92, 246, 0.06);
      }

      .summary-text {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .summary-text small {
        color: var(--muted);
      }

      .summary strong {
        font-size: 15px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        background: rgba(59,130,246,0.14);
        color: #dfeeff;
        border: 1px solid rgba(59,130,246,0.3);
      }

      @media (max-width: 620px) {
        .grid { grid-template-columns: 1fr; }
        .topbar { flex-direction: column; align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="topbar">
        <div class="brand">
          <div class="brand-mark">✦</div>
          <span>AI Model selector</span>
        </div>
        <div class="status-pill">Keys loaded</div>
      </div>

      <div class="content">
        <div class="section">
          <label class="label" for="modelSelect">Model</label>
          <div class="select-wrap">
            <select id="modelSelect" aria-label="Select AI model"></select>
            <div class="caret">▾</div>
          </div>
        </div>

        <div class="section">
          <div class="label">API Keys</div>
          <div class="grid" id="keyGrid"></div>
        </div>

        <div class="summary">
          <div class="summary-text">
            <small>Active route</small>
            <strong id="activeModelName">OpenRouter Auto</strong>
          </div>
          <div class="tag" id="activeProviderTag">OpenRouter</div>
        </div>
      </div>
    </div>

    <script>
      // Replace these with the exact keys you previously sent.
      // The UI is designed to use the active provider's key automatically.
      const apiKeys = {
        openrouter: "sk-or-v1-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
        groq: "gsk_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
        nvidia: "nvapi-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx",
        gemini: "AIzaSyXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX",
        anthropic: "sk-ant-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      };

      const models = [
        { id: "openrouter/auto", label: "OpenRouter Auto", provider: "openrouter" },
        { id: "openrouter/qwen/qwen-2.5-72b-instruct", label: "Qwen 2.5 72B", provider: "openrouter" },
        { id: "openrouter/meta-llama/llama-3.1-8b-instruct", label: "Llama 3.1 8B", provider: "openrouter" },
        { id: "groq/llama-3.3-70b-versatile", label: "Groq Llama 3.3 70B", provider: "groq" },
        { id: "groq/llama-3.1-8b-instant", label: "Groq Llama 3.1 8B", provider: "groq" },
        { id: "nvidia/llama-3.1-8b-instruct", label: "NVIDIA Llama 3.1 8B", provider: "nvidia" },
        { id: "anthropic/claude-3.5-sonnet", label: "Claude 3.5 Sonnet", provider: "anthropic" },
        { id: "google/gemini-2.5-flash", label: "Gemini 2.5 Flash", provider: "gemini" }
      ];

      const providerLabel = {
        openrouter: "OpenRouter",
        groq: "Groq",
        nvidia: "NVIDIA",
        gemini: "Gemini",
        anthropic: "Anthropic"
      };

      const modelSelect = document.getElementById("modelSelect");
      const activeModelName = document.getElementById("activeModelName");
      const activeProviderTag = document.getElementById("activeProviderTag");
      const keyGrid = document.getElementById("keyGrid");

      function renderModelOptions() {
        models.forEach((model) => {
          const option = document.createElement("option");
          option.value = model.id;
          option.textContent = `${model.label} · ${providerLabel[model.provider]}`;
          modelSelect.appendChild(option);
        });

        modelSelect.value = "openrouter/auto";
        updateSummary();
      }

      function renderKeyGrid() {
        Object.entries(apiKeys).forEach(([provider, value]) => {
          const box = document.createElement("div");
          box.className = "key-box";

          const title = document.createElement("strong");
          title.textContent = providerLabel[provider] || provider;

          const token = document.createElement("div");
          token.className = "token";
          token.textContent = value || "not configured";

          box.appendChild(title);
          box.appendChild(token);
          keyGrid.appendChild(box);
        });
      }

      function updateSummary() {
        const selected = models.find((m) => m.id === modelSelect.value) || models[0];
        activeModelName.textContent = selected.label;
        activeProviderTag.textContent = providerLabel[selected.provider] || selected.provider;
      }

      modelSelect.addEventListener("change", updateSummary);

      renderModelOptions();
      renderKeyGrid();
    </script>
  </body>
</html>
