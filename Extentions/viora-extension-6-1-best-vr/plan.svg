<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect x="30" y="20" width="580" height="240" rx="14" fill="#0f172a" stroke="#1e293b"/>
  <text x="50" y="48" fill="#e2e8f0" font-size="14" font-weight="700">action_plan — "book a flight"</text>
