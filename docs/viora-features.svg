<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Viora feature overview</title>
  <desc id="desc">Illustrated cards for AI chat, coding and math, web sources, and image creation. Availability varies by installed version.</desc>
  <rect width="1100" height="250" rx="22" fill="#101426"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(22 22)">
      <rect width="256" height="206" rx="18" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity=".7"/>
      <circle cx="48" cy="48" r="24" fill="#8b5cf6" fill-opacity=".3"/>
      <path d="M35 41h26a7 7 0 0 1 7 7v10a7 7 0 0 1-7 7H47l-9 7v-7h-3a7 7 0 0 1-7-7V48a7 7 0 0 1 7-7z" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="24" y="112" font-size="21" font-weight="700" fill="#fff">AI assistant</text>
      <text x="24" y="142" font-size="14" fill="#dbeafe">Ask questions and explore</text>
      <text x="24" y="162" font-size="14" fill="#dbeafe">ideas with your browser.</text>
    </g>
    <g transform="translate(296 22)">
      <rect width="256" height="206" rx="18" fill="#172554" stroke="#38bdf8" stroke-opacity=".65"/>
      <circle cx="48" cy="48" r="24" fill="#0ea5e9" fill-opacity=".22"/>
      <path d="M38 35l-9 13 9 13M58 35l9 13-9 13M53 30l-10 36" fill="none" stroke="#7dd3fc" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="112" font-size="21" font-weight="700" fill="#fff">Code &amp; math</text>
      <text x="24" y="142" font-size="14" fill="#dbeafe">Work through problems</text>
      <text x="24" y="162" font-size="14" fill="#dbeafe">and coding tasks.</text>
    </g>
    <g transform="translate(570 22)">
      <rect width="256" height="206" rx="18" fill="#083344" stroke="#22d3ee" stroke-opacity=".65"/>
      <circle cx="48" cy="48" r="24" fill="#06b6d4" fill-opacity=".22"/>
      <circle cx="46" cy="46" r="13" fill="none" stroke="#67e8f9" stroke-width="2.5"/>
      <path d="M56 56l10 10M36 46h20M46 36v20" fill="none" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round"/>
      <text x="24" y="112" font-size="21" font-weight="700" fill="#fff">Web sources</text>
      <text x="24" y="142" font-size="14" fill="#cffafe">Review citations and open</text>
      <text x="24" y="162" font-size="14" fill="#cffafe">sources when available.</text>
    </g>
    <g transform="translate(844 22)">
      <rect width="234" height="206" rx="18" fill="#3b0764" stroke="#c084fc" stroke-opacity=".65"/>
      <circle cx="48" cy="48" r="24" fill="#c084fc" fill-opacity=".2"/>
      <rect x="33" y="34" width="30" height="27" rx="5" fill="none" stroke="#e9d5ff" stroke-width="2.5"/>
      <circle cx="42" cy="42" r="3" fill="#e9d5ff"/>
      <path d="M35 56l9-8 6 5 5-4 6 7" fill="none" stroke="#e9d5ff" stroke-width="2.2" stroke-linejoin="round"/>
      <text x="20" y="112" font-size="21" font-weight="700" fill="#fff">Image tools</text>
      <text x="20" y="142" font-size="14" fill="#f3e8ff">Create visuals if your</text>
      <text x="20" y="162" font-size="14" fill="#f3e8ff">installed build supports it.</text>
    </g>
  </g>
</svg>