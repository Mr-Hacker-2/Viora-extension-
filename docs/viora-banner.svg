  <text x="70" y="196" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="57" font-weight="750" fill="#ffffff">Viora Extension</text>
  <text x="73" y="239" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" fill="#e0e7ff">Your AI workspace, right in the browser.</text>
  <rect x="72" y="275" width="170" height="34" rx="17" fill="#ffffff" fill-opacity=".13" stroke="#c4b5fd" stroke-opacity=".5"/>
  <text x="157" y="297" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" fill="#f5f3ff">INSTALL • EXPLORE • CREATE</text>
</svg>